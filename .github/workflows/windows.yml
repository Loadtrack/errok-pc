name: Проверка и установщик Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости интерфейса
        run: npm ci

      - name: Проверить TypeScript и интерфейс
        run: npm run build

      - name: Проверить ядро Rust на реальных примерах
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Собрать установщик Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сохранить установщик как artifact
        uses: actions/upload-artifact@v4
        with:
          name: errok-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
